[project]
name = "capybara"
version = "0.1.0"
description = "Capybara — an autonomous Alpaca paper-trading bot with a market-regime strategy selector and human-in-the-loop controls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Capybara" }]

dependencies = [
    # Broker + market data
    "alpaca-py>=0.33.0",
    # Numerics / features
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # Control-plane API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    # Config / models
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    # HTTP (used by data helpers / health checks)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
capybara = "capybara.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capybara"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# E501: line length handled by formatter; B008: FastAPI uses Depends()/Header() as
# argument defaults by design; B905: zip strict= not required here.
ignore = ["E501", "B008", "B905"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
